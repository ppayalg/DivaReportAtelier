[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diva-atelier-ai"
version = "0.1.0"
description = "Agentic report generation for dress and fashion reporting."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []          # standard library only; the Anthropic API is called over plain HTTPS

[project.scripts]
diva-atelier = "diva_atelier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
